<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1a0f" />
  <title>Buckeye Hunter Hub — Mobile Hunting Map</title>

  <!-- Leaflet core -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet.draw -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

  <!-- SunCalc -->
  <script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>

  <style>
    :root{
      --bg:#0b1a0f;        /* deep forest */
      --panel:#101f14;     /* card */
      --muted:#1a2b1f;
      --accent:#6dbc5d;    /* green */
      --text:#e7f1e8;
      --subtle:#a3b7a6;
      --danger:#f87171;
      --shadow:0 12px 30px rgba(0,0,0,.35);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html,body,#app{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Roboto,Arial,sans-serif}
    #map{position:fixed;inset:0;height:100dvh}
    @supports (height: 100svh){ #map{height:100svh} }

    /* Top-right logo (adjust width as you like) */
    .brand-logo{position:fixed;top:10px;right:10px;z-index:1300;background:rgba(16,31,20,.7);border:1px solid #203325;border-radius:12px;padding:6px;box-shadow:var(--shadow)}
    .brand-logo img{display:block;width:200px;height:auto}
    @media (max-width:640px){ .brand-logo img{width:160px} }

    /* Bottom main menu */
    .main-menu{position:fixed;left:0;right:0;bottom:0;z-index:1200;display:flex;gap:8px;justify-content:flex-start;align-items:center;padding:10px 12px calc(10px + var(--safe-bottom));background:linear-gradient(180deg,rgba(11,26,15,.1),rgba(11,26,15,.85));backdrop-filter:blur(8px);border-top:1px solid #203325;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .main-menu button{flex:0 0 auto;min-width:132px;padding:10px 12px;border:1px solid #25432b;border-radius:12px;background:#14271a;color:var(--text);font-size:14px;cursor:pointer;white-space:nowrap}

    /* Sheets (bottom drawers) */
    .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1199;display:none}
    .backdrop.show{display:block}
    .sheet{position:fixed;left:0;right:0;bottom:0;z-index:1200;background:var(--panel);border-top:1px solid #203325;border-radius:16px 16px 0 0;box-shadow:var(--shadow);transform:translateY(110%);transition:transform .25s ease}
    .sheet.show{transform:translateY(0)}
    .sheet .grab{width:36px;height:4px;border-radius:999px;background:#2b4231;margin:8px auto}
    .sheet .option{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid #1d3323;cursor:pointer}
    .sheet h4{margin:6px 16px 8px;font-size:14px;color:var(--subtle)}
    .sheet .content{padding:6px 16px 14px}
    .sheet input,.sheet select,.sheet textarea{width:100%;padding:8px 10px;border-radius:10px;border:1px solid #25432b;background:#14271a;color:var(--text)}

    /* County & City labels (pills) */
    .county-label,.city-label{position:absolute;transform:translate(-50%,-50%);background:rgba(16,31,20,.75);border:1px solid #203325;color:#e7f1e8;padding:2px 6px;border-radius:10px;font-weight:600;letter-spacing:.3px;white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.5);pointer-events:none;user-select:none}

    /* Search bar (top center) */
    .search-wrap{position:fixed;top:12px;left:12px;right:240px;z-index:1250;display:flex;gap:6px}
    .search{flex:1;display:flex;align-items:center;gap:8px;background:rgba(16,31,20,.85);border:1px solid #203325;border-radius:12px;padding:8px 10px;box-shadow:var(--shadow)}
    .search input{flex:1;background:transparent;border:0;outline:none;color:var(--text);font-size:14px}
    .search .btn{cursor:pointer;border:1px solid #25432b;background:#14271a;border-radius:10px;padding:6px 10px;color:var(--text)}
    .results{position:fixed;top:56px;left:12px;right:240px;z-index:1250;background:rgba(16,31,20,.98);border:1px solid #203325;border-radius:12px;box-shadow:var(--shadow);display:none;max-height:50vh;overflow:auto}
    .res{padding:10px 12px;border-top:1px solid #1d3323;cursor:pointer}
    .res:first-child{border-top:0}
    .res .sub{display:block;color:#a3b7a6;font-size:12px;margin-top:2px}
    @media (max-width:800px){
      .search-wrap{right:12px}
      .results{right:12px}
    }

    /* Shiny blue GPS dot + accuracy ring */
    .gps-dot{width:16px;height:16px;border-radius:50%;background:#3b82f6;box-shadow:0 0 0 6px rgba(59,130,246,.25), 0 0 20px rgba(59,130,246,.9);border:2px solid #fff;animation:pulse 2s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 6px rgba(59,130,246,.25)}70%{box-shadow:0 0 0 18px rgba(59,130,246,.0)}100%{box-shadow:0 0 0 6px rgba(59,130,246,.25)}}
  </style>
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <!-- Logo (replace src with your GitHub raw if you host it there) -->
    <div class="brand-logo">
      <img src="logo.png" alt="Buckeye Hunter Hub" />
    </div>

    <!-- Search -->
    <div class="search-wrap">
      <div class="search">
        <span>🔎</span>
        <input id="searchInput" type="search" placeholder="Search Ohio cities, addresses, places…" />
        <button id="searchGo" class="btn">Search</button>
        <button id="searchClear" class="btn">Clear</button>
      </div>
    </div>
    <div id="searchResults" class="results"></div>

    <!-- Bottom main menu -->
    <nav class="main-menu">
      <button id="toggleBasemap">Basemap</button>
      <button id="menuWaypoints">Waypoints</button>
      <button id="menuTrack">Track</button>
      <button id="menuRadar">Radar</button>
      <button id="menuWind">Wind</button>
      <button id="menuMoon">Moon</button>
      <button id="menuScore">Hunt Score</button>
      <button id="menuLocate">Locate Me</button>
      <button id="btnExport">Export</button>
      <button id="btnImport">Import</button>
      <button id="btnDeleteMode">Delete: Off</button>
      <input type="file" id="fileImport" accept=".json,.geojson,application/json,application/geo+json" style="display:none" />
    </nav>

    <!-- Backdrop & Basemap sheet (only overlays relevant to this reply shown) -->
    <div class="backdrop" id="sheetBackdrop"></div>
    <div class="sheet" id="basemapSheet" aria-hidden="true">
      <div class="grab"></div>
      <h4>Basemap</h4>
      <div class="option" data-radio="basemap" data-value="basic"><span>Basic</span><input type="radio" name="basemap" value="basic"></div>
      <div class="option" data-radio="basemap" data-value="satellite"><span>Satellite</span><input type="radio" name="basemap" value="satellite"></div>
      <div class="option" data-radio="basemap" data-value="topo"><span>Topographic</span><input type="radio" name="basemap" value="topo"></div>
      <h4 style="margin-top:10px">Overlays</h4>
      <div class="option"><span>Ohio Public Hunting</span><input id="ovlOhio" type="checkbox"></div>
      <div class="option"><span>Ohio Counties</span><input id="ovlCounties" type="checkbox"></div>
      <div class="option"><span>Ohio Cities</span><input id="ovlCities" type="checkbox"></div>
      <div class="option"><span>Ohio Waterfowl Zones</span><input id="ovlWaterfowl" type="checkbox"></div>
      <div class="option"><span>My Drawings</span><input id="ovlDraw" type="checkbox"></div>
      <div class="option"><span>Hunt Markers</span><input id="ovlMarks" type="checkbox"></div>
      <div class="option"><span>My Track</span><input id="ovlTrack" type="checkbox"></div>
    </div>
  </div>

  <script>
    /************************
     * MAP & BASELAYERS
     ************************/
    const map = L.map('map').setView([40.4173, -82.9071], 7);
    const basic = L.tileLayer('https://api.maptiler.com/maps/basic/{z}/{x}/{y}.png?key=VLOZCnjQYBtgpZ3BXBK3', { attribution: '&copy; MapTiler & OpenStreetMap contributors' }).addTo(map);
    const satellite = L.tileLayer('https://api.maptiler.com/tiles/satellite-v2/{z}/{x}/{y}.jpg?key=VLOZCnjQYBtgpZ3BXBK3', { attribution: '&copy; MapTiler' });
    const topo = L.tileLayer('https://api.maptiler.com/maps/topo/{z}/{x}/{y}.png?key=VLOZCnjQYBtgpZ3BXBK3', { attribution: '&copy; MapTiler & OSM' });

    const baseByKey = { basic, satellite, topo };
    const STORAGE_BASE = 'ui_basemap_key';
    function setBasemap(key){ Object.values(baseByKey).forEach(l=> map.removeLayer(l)); baseByKey[key].addTo(map); localStorage.setItem(STORAGE_BASE, key); }
    (function restoreBasemap(){ const k = localStorage.getItem(STORAGE_BASE); if(k && baseByKey[k]) setBasemap(k); })();

    /************************
     * DRAW + MARKERS STORAGE (abbrev; unchanged behavior)
     ************************/
    const drawnItems = new L.FeatureGroup().addTo(map);
    map.addControl(new L.Control.Draw({ position:'topleft', edit:{ featureGroup: drawnItems }, draw:{ circle:true } }));
    const STORAGE_DRAW = 'bhh_drawings_v6';
    const markersLayer = L.featureGroup().addTo(map);
    const STORAGE_MARK = 'bhh_markers_v4';

    function featureTypeFromLayer(l){
      if(l instanceof L.Circle) return 'circle';
      if(l instanceof L.Rectangle) return 'rectangle';
      if(l instanceof L.Polygon && !(l instanceof L.Rectangle)) return 'polygon';
      if(l instanceof L.Polyline && !(l instanceof L.Polygon)) return 'polyline';
      return 'shape';
    }

    function defaultShapeName(type){
      const base = {polyline:'Line', polygon:'Area', rectangle:'Plot', circle:'Circle', shape:'Shape'}[type] || 'Shape';
      let n=1; drawnItems.eachLayer(l=>{ if(featureTypeFromLayer(l)===type) n++; });
      return `${base} ${n}`;
    }

    function saveDraw(){
      const geojson = { type:'FeatureCollection', features:[] };
      const circles = [];
      drawnItems.eachLayer(l=>{
        const type = featureTypeFromLayer(l);
        if(type==='circle'){
          const c = l.getLatLng();
          circles.push({ lat:c.lat, lng:c.lng, radius:l.getRadius(), properties:{ name:l._bhhName || defaultShapeName('circle'), shapeType:'circle' } });
        } else {
          const f = l.toGeoJSON();
          f.properties = Object.assign({}, f.properties||{}, { name: l._bhhName || defaultShapeName(type), shapeType:type });
          geojson.features.push(f);
        }
      });
      localStorage.setItem(STORAGE_DRAW, JSON.stringify({ geojson, circles }));
    }
    function restoreDraw(){
      const raw = localStorage.getItem(STORAGE_DRAW); if(!raw) return;
      try{
        const data = JSON.parse(raw);
        if(data.geojson){
          L.geoJSON(data.geojson, { onEachFeature:(feat,layer)=>{ layer._bhhName = (feat.properties && feat.properties.name) || defaultShapeName(featureTypeFromLayer(layer)); drawnItems.addLayer(layer); }});
          (data.circles||[]).forEach(c=>{ const layer=L.circle([c.lat,c.lng],{radius:c.radius}); layer._bhhName=(c.properties&&c.properties.name)||defaultShapeName('circle'); drawnItems.addLayer(layer); });
        }
      }catch(e){ console.warn('restore drawings failed', e); }
    }
    restoreDraw();
    map.on(L.Draw.Event.CREATED, e=>{ const layer=e.layer; const type=e.layerType||featureTypeFromLayer(layer); const nm=prompt(`Name this ${type}:`, defaultShapeName(type)); layer._bhhName=(nm&&nm.trim())||defaultShapeName(type); drawnItems.addLayer(layer); saveDraw(); refreshWaypointsUI(); });
    map.on(L.Draw.Event.EDITED, saveDraw);
    map.on(L.Draw.Event.DELETED, saveDraw);

    function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
    function defaultName(type){ const base = markerTypes[type]?.label || 'Marker'; let n = 1; markersLayer.eachLayer(m=>{ if(m.options.type===type) n++; }); return `${base} ${n}`; }

    const IS_MOBILE = matchMedia('(max-width:640px)').matches;
    const ICON_SZ = IS_MOBILE ? 28 : 32;
    const FONT_SZ = IS_MOBILE ? 16 : 18;
    function makeIcon(bg,emoji){
      return L.divIcon({
        className:'',
        html:`<div style="background:${bg};border:2px solid #333;border-radius:50%;width:${ICON_SZ}px;height:${ICON_SZ}px;display:flex;align-items:center;justify-content:center;font-size:${FONT_SZ}px;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);">${emoji}</div>`,
        iconSize:[ICON_SZ,ICON_SZ], iconAnchor:[ICON_SZ/2, ICON_SZ], popupAnchor:[0, -ICON_SZ*0.9]
      });
    }
    const markerTypes = {
      stand:{label:'Tree Stand', emoji:'🎯', icon:makeIcon('#2563eb','🎯')},
      feeder:{label:'Feeder', emoji:'🍽️', icon:makeIcon('#16a34a','🍽️')},
      camera:{label:'Trail Camera', emoji:'📷', icon:makeIcon('#111827','📷')},
      scrape:{label:'Scrape', emoji:'🦌', icon:makeIcon('#6d28d9','🦌')},
      rub:{label:'Rub', emoji:'🪵', icon:makeIcon('#b45309','🪵')},
      water:{label:'Water Source', emoji:'💧', icon:makeIcon('#0891b2','💧')}
    };

    function markerPopupHTML(m){
      const cfg = markerTypes[m.options.type] || {label:'Marker'};
      return `<b>${m.options.name}</b><div class="tag">${cfg.label}</div><div style="margin-top:8px"><button class="del">Delete</button></div>`;
    }
    function addMarker(latlng, type, name, id){
      const cfg = markerTypes[type] || {label:'Marker', icon:makeIcon('#555','📍')};
      const m = L.marker(latlng, { icon:cfg.icon, draggable:true, type, id:(id||uid()), name:(name||defaultName(type)) })
        .addTo(markersLayer)
        .bindPopup(markerPopupHTML({options:{...cfg, ...{name:(name||defaultName(type)), type}}}));
      m.on('dragend', saveMarkers);
      m.on('popupopen', e=>{ e.popup.getElement().querySelector('button.del').addEventListener('click', ()=>{ markersLayer.removeLayer(m); saveMarkers(); refreshWaypointsUI(); }); });
      saveMarkers(); return m;
    }
    function serializeMarkers(){ const list=[]; markersLayer.eachLayer(m=>{ const {lat,lng}=m.getLatLng(); list.push({id:m.options.id, name:m.options.name, type:m.options.type||'marker', lat, lng}); }); return list; }
    function deserializeMarkers(list){ markersLayer.clearLayers(); (list||[]).forEach(m=> addMarker([m.lat,m.lng], m.type, m.name, m.id)); }
    function saveMarkers(){ localStorage.setItem(STORAGE_MARK, JSON.stringify(serializeMarkers())); }
    (function restoreMarkers(){ try{ const raw=localStorage.getItem(STORAGE_MARK); if(raw) deserializeMarkers(JSON.parse(raw)); }catch(e){} })();

    function refreshWaypointsUI(){ /* keep stubbed; your existing sheet reuses this */ }

    /************************
     * OHIO PUBLIC HUNTING (local file or ODNR fallback)
     ************************/
    const ohioPublic = L.geoJSON(null, {
      style:{ color:'#8b5cf6', weight:2, fillOpacity:0.15 },
      onEachFeature:(feat, layer)=>{
        const p = feat && feat.properties ? feat.properties : {};
        const header = ['NAME','AREA_NAME','UNIT_NAME','PARK_NAME','SITE_NAME'].find(k=>k in p) || Object.keys(p)[0];
        const name = header ? String(p[header]) : 'Public Hunting Area';
        layer.bindPopup(`<b>${name}</b>`);
      }
    });
    (async function loadOhioPublic(){
      try{
        const r = await fetch('ohio_public_hunting.geojson', {cache:'reload'});
        if(r.ok){ ohioPublic.addData(await r.json()); return; }
      }catch(e){}
      try{
        const r2 = await fetch('https://gis2.ohiodnr.gov/ArcGIS/rest/services/OIT_Services/DNR_Fed_Lands_Nav_Base/MapServer/2/query?where=1%3D1&outFields=*&outSR=4326&f=geojson');
        ohioPublic.addData(await r2.json());
      }catch(e){ console.warn('ODNR fallback failed', e); }
    })();

    /************************
     * OHIO COUNTIES + LABELS
     ************************/
    const ohioCounties = L.geoJSON(null, {
      style: { color:'#94a3b8', weight:1, fill:false, opacity:0.9 },
      onEachFeature: (feat, layer) => {
        layer._countyName = (feat.properties && (feat.properties.County_Name || feat.properties.COUNTY_NAME)) || 'County';
      }
    });
    const countyLabels = L.layerGroup();
    function labelFontForZoom(z){ if(z>=11) return 14; if(z>=9) return 12; if(z>=7) return 10; return 0; }
    function refreshCountyLabels(){
      const fs = labelFontForZoom(map.getZoom());
      countyLabels.eachLayer(m => { const el=m.getElement(); if(!el) return; el.style.display = fs===0 ? 'none':'block'; if(fs) el.style.fontSize = fs+'px'; });
    }
    function buildCountyLabels(){
      countyLabels.clearLayers();
      ohioCounties.eachLayer(layer=>{
        try{
          const center = layer.getBounds().getCenter();
          const lbl = L.marker(center, { interactive:false, icon: L.divIcon({ className:'county-label', html: layer._countyName||'County' }) });
          countyLabels.addLayer(lbl);
        }catch(_){}
      });
      refreshCountyLabels();
      if(map.hasLayer(ohioCounties) && !map.hasLayer(countyLabels)) countyLabels.addTo(map);
    }
    (async function loadOhioCounties(){
      try{
        const url='https://gis.dot.state.oh.us/arcgis/rest/services/Basemap/ODOT_Basemap/MapServer/165/query?where=1%3D1&outFields=County_Name&outSR=4326&f=geojson';
        const j = await (await fetch(url)).json();
        ohioCounties.addData(j); buildCountyLabels();
      }catch(e){ console.warn('Counties layer fetch failed', e); }
    })();
    map.on('zoomend', refreshCountyLabels);

    /************************
     * OHIO CITIES + LABELS (local file you added)
     ************************/
    const ohioCities = L.geoJSON(null, {
      pointToLayer: (feat, latlng) => L.circleMarker(latlng, { radius:4, color:'#34d399', weight:2, fillColor:'#34d399', fillOpacity:0.7 }),
      onEachFeature: (feat, layer) => { layer._cityName = (feat.properties && (feat.properties.NAME || feat.properties.Name)) || 'City'; }
    });
    const cityLabels = L.layerGroup();
    function refreshCityLabels(){
      const z = map.getZoom();
      const fs = (z>=11? 13 : z>=9? 12 : z>=8? 11 : 0);
      cityLabels.eachLayer(m => { const el = m.getElement(); if(!el) return; el.style.display = fs===0 ? 'none' : 'block'; if(fs) el.style.fontSize = fs+'px'; });
    }
    function buildCityLabels(){
      cityLabels.clearLayers();
      ohioCities.eachLayer(layer=>{
        try{
          const ll = layer.getLatLng ? layer.getLatLng() : (layer.getBounds && layer.getBounds().getCenter());
          const lbl = L.marker(ll, { interactive:false, icon: L.divIcon({ className:'city-label', html: layer._cityName || 'City' }) });
          cityLabels.addLayer(lbl);
        }catch(_){}
      });
      refreshCityLabels();
      if(map.hasLayer(ohioCities) && !map.hasLayer(cityLabels)) cityLabels.addTo(map);
    }
    (async function loadOhioCities(){
      try{
        const r = await fetch('ohio_cities.geojson', { cache:'reload' });
        if(!r.ok) throw new Error('cities fetch failed');
        ohioCities.addData(await r.json()); buildCityLabels();
      }catch(e){ console.warn('Cities not loaded:', e); }
    })();
    map.on('zoomend', refreshCityLabels);

    /************************
     * WATERFOWL ZONES + LABELS (local file)
     ************************/
    const waterfowlZones = L.geoJSON(null, {
      style: { color:'#0ea5e9', weight:2, fillOpacity:0.15 },
      onEachFeature: (feat, layer) => {
        const p = feat.properties || {};
        layer._zoneName = String(p.ZONE || p.Zone || p.NAME || p.Name || 'Waterfowl Zone');
        layer.bindPopup(`<b>${layer._zoneName}</b>`);
      }
    });
    const waterfowlLabels = L.layerGroup();
    function refreshWaterfowlLabels(){
      const fs = labelFontForZoom(map.getZoom());
      waterfowlLabels.eachLayer(m => { const el=m.getElement(); if(!el) return; el.style.display = fs===0 ? 'none' : 'block'; if(fs) el.style.fontSize = fs+'px'; });
    }
    function buildWaterfowlLabels(){
      waterfowlLabels.clearLayers();
      waterfowlZones.eachLayer(layer=>{
        try{
          const ctr = layer.getBounds().getCenter();
          const lbl = L.marker(ctr, { interactive:false, icon: L.divIcon({ className:'city-label', html: layer._zoneName || 'Zone' }) });
          waterfowlLabels.addLayer(lbl);
        }catch(_){}
      });
      refreshWaterfowlLabels();
      if(map.hasLayer(waterfowlZones) && !map.hasLayer(waterfowlLabels)) waterfowlLabels.addTo(map);
    }
    (async function loadWaterfowl(){
      try{
        const r = await fetch('ohio_waterfowl_zones.geojson', { cache:'reload' });
        if(!r.ok) throw new Error('waterfowl fetch failed');
        waterfowlZones.addData(await r.json()); buildWaterfowlLabels();
      }catch(e){ console.warn('Waterfowl zones not loaded:', e); }
    })();
    map.on('zoomend', refreshWaterfowlLabels);

    /************************
     * LAYERS CONTROL + BASEMAP SHEET
     ************************/
    const overlaysForControl = {
      'Ohio Public Hunting': ohioPublic,
      'Ohio Counties': ohioCounties,
      'Ohio Cities': ohioCities,
      'Ohio Waterfowl Zones': waterfowlZones,
      'Hunt Markers': markersLayer,
      'My Drawings': drawnItems
    };
    L.control.layers({ 'Basic':basic, 'Satellite':satellite, 'Topographic':topo }, overlaysForControl, { position:'bottomleft' }).addTo(map);

    const sheetBg = document.getElementById('sheetBackdrop');
    const sheet = document.getElementById('basemapSheet');
    function openSheet(){ sheetBg.classList.add('show'); sheet.classList.add('show'); syncOverlayChecks(); syncBaseRadio(); }
    function closeSheet(){ sheetBg.classList.remove('show'); sheet.classList.remove('show'); }
    sheetBg.onclick = closeSheet;
    document.querySelectorAll('.sheet .option').forEach(opt=>{
      opt.addEventListener('click', (ev)=>{
        if(ev.target.tagName==='SELECT') return;
        const input = opt.querySelector('input'); if(!input) return;
        if(input.type==='radio'){ input.checked = true; input.dispatchEvent(new Event('change',{bubbles:true})); }
        if(input.type==='checkbox'){ input.checked = !input.checked; input.dispatchEvent(new Event('change',{bubbles:true})); }
      });
    });

    document.getElementById('toggleBasemap').onclick = openSheet;
    const radios = Array.from(document.querySelectorAll('input[name="basemap"]'));
    function syncBaseRadio(){ const k = localStorage.getItem(STORAGE_BASE) || 'basic'; const r = radios.find(r=>r.value===k); if(r) r.checked = true; }
    radios.forEach(r=> r.addEventListener('change', ()=> setBasemap(r.value)));

    const ovlOhio = document.getElementById('ovlOhio');
    const ovlCounties = document.getElementById('ovlCounties');
    const ovlCities = document.getElementById('ovlCities');
    const ovlWaterfowl = document.getElementById('ovlWaterfowl');
    const ovlDraw = document.getElementById('ovlDraw');
    const ovlMarks = document.getElementById('ovlMarks');
    const ovlTrack = document.getElementById('ovlTrack');

    const trackLayer = L.polyline([], { color:'#22d3ee', weight:4, opacity:0.9 }).addTo(map); // for ovlTrack checkbox
    function syncOverlayChecks(){
      ovlOhio.checked = map.hasLayer(ohioPublic);
      ovlCounties.checked = map.hasLayer(ohioCounties);
      ovlCities.checked = map.hasLayer(ohioCities);
      ovlWaterfowl.checked = map.hasLayer(waterfowlZones);
      ovlDraw.checked = map.hasLayer(drawnItems);
      ovlMarks.checked = map.hasLayer(markersLayer);
      ovlTrack.checked = map.hasLayer(trackLayer);
    }
    ovlOhio.onchange = ()=> ovlOhio.checked ? ohioPublic.addTo(map) : map.removeLayer(ohioPublic);
    ovlCounties.onchange = ()=> { if(ovlCounties.checked){ ohioCounties.addTo(map); countyLabels.addTo(map); refreshCountyLabels(); } else { map.removeLayer(ohioCounties); map.removeLayer(countyLabels); } };
    ovlCities.onchange = ()=> { if(ovlCities.checked){ ohioCities.addTo(map); cityLabels.addTo(map); refreshCityLabels(); } else { map.removeLayer(ohioCities); map.removeLayer(cityLabels); } };
    ovlWaterfowl.onchange = ()=> { if(ovlWaterfowl.checked){ waterfowlZones.addTo(map); waterfowlLabels.addTo(map); refreshWaterfowlLabels(); } else { map.removeLayer(waterfowlZones); map.removeLayer(waterfowlLabels); } };
    ovlDraw.onchange = ()=> ovlDraw.checked ? drawnItems.addTo(map) : map.removeLayer(drawnItems);
    ovlMarks.onchange = ()=> ovlMarks.checked ? markersLayer.addTo(map) : map.removeLayer(markersLayer);
    ovlTrack.onchange = ()=> ovlTrack.checked ? trackLayer.addTo(map) : map.removeLayer(trackLayer);

    // Keep label groups in sync even when toggled via Leaflet control
    map.on('overlayadd', (e)=>{
      if(e.layer===ohioCounties){ countyLabels.addTo(map); refreshCountyLabels(); }
      if(e.layer===ohioCities){ cityLabels.addTo(map); refreshCityLabels(); }
      if(e.layer===waterfowlZones){ waterfowlLabels.addTo(map); refreshWaterfowlLabels(); }
    });
    map.on('overlayremove', (e)=>{
      if(e.layer===ohioCounties){ map.removeLayer(countyLabels); }
      if(e.layer===ohioCities){ map.removeLayer(cityLabels); }
      if(e.layer===waterfowlZones){ map.removeLayer(waterfowlLabels); }
    });

    /************************
     * SEARCH (Photon → fallback Nominatim)
     ************************/
    const searchInput = document.getElementById('searchInput');
    const searchGo = document.getElementById('searchGo');
    const searchClear = document.getElementById('searchClear');
    const searchResults = document.getElementById('searchResults');
    let searchPin = null;

    function showResults(items){
      if(!items.length){ searchResults.style.display='none'; searchResults.innerHTML=''; return; }
      searchResults.innerHTML = items.map((it,i)=>{
        const title = it.title;
        const sub = it.sub || '';
        return `<div class="res" data-i="${i}">${title}<span class="sub">${sub}</span></div>`;
      }).join('');
      searchResults.style.display='block';
    }
    function closeResults(){ searchResults.style.display='none'; searchResults.innerHTML=''; }

    async function searchPlaces(query){
      const c = map.getCenter();
      // 1) Photon (good for addresses & cities, CORS-friendly)
      try{
        const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=8&lat=${c.lat}&lon=${c.lng}`;
        const r = await fetch(url);
        if(r.ok){
          const j = await r.json();
          const feats = (j.features||[]).map(f=>{
            const p=f.properties||{};
            const title = p.name || p.city || p.street || p.state || p.country || 'Result';
            const sub = [p.street && p.housenumber ? `${p.housenumber} ${p.street}`:null, p.city, p.state, p.country].filter(Boolean).join(' • ');
            const [lon,lat] = f.geometry.coordinates;
            return { lat, lon, title, sub };
          });
          if(feats.length) return feats;
        }
      }catch(_){}
      // 2) Fallback Nominatim (place + address)
      try{
        const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(query)}&limit=8&addressdetails=1`;
        const r = await fetch(url, { headers: { 'Accept-Language':'en' }});
        if(r.ok){
          const j = await r.json();
          return j.map(it=>{
            const title = it.display_name.split(',')[0];
            const sub = it.display_name.replace(title+',','').trim();
            return { lat: parseFloat(it.lat), lon: parseFloat(it.lon), title, sub };
          });
        }
      }catch(_){}
      return [];
    }

    async function doSearch(){
      const q = (searchInput.value||'').trim();
      if(!q) { closeResults(); return; }
      const items = await searchPlaces(q);
      showResults(items);
      // enter selects first result if any
      if(items.length){ flyToResult(items[0]); }
    }
    function flyToResult(item){
      map.setView([item.lat, item.lon], Math.max(14, map.getZoom()));
      if(!searchPin){
        searchPin = L.marker([item.lat, item.lon], { icon: L.divIcon({className:'', html:'<div style="width:14px;height:14px;border-radius:50%;background:#f59e0b;border:2px solid #fff;box-shadow:0 0 12px rgba(245,158,11,.9)"></div>'}), interactive:false });
        searchPin.addTo(map);
      } else {
        searchPin.setLatLng([item.lat, item.lon]);
      }
    }
    searchResults.addEventListener('click', (e)=>{
      const row = e.target.closest('.res'); if(!row) return;
      const idx = +row.dataset.i;
      const htmlItems = Array.from(searchResults.querySelectorAll('.res'));
      // we don't keep items array; simpler: trigger a fresh search & select idx
      (async ()=>{
        const items = await searchPlaces(searchInput.value.trim());
        if(items[idx]) flyToResult(items[idx]);
        closeResults();
      })();
    });

    searchGo.onclick = doSearch;
    searchInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doSearch(); });
    searchClear.onclick = ()=>{ searchInput.value=''; closeResults(); if(searchPin){ map.removeLayer(searchPin); searchPin=null; } };

    /************************
     * ALWAYS-ON BLUE DOT (toggle via Locate Me)
     ************************/
    const btnLocate = document.getElementById('menuLocate');
    let gpsWatch = null, gpsDot = null, gpsAccRing = null;
    function toggleLocate(){
      if(gpsWatch){ navigator.geolocation.clearWatch(gpsWatch); gpsWatch=null; btnLocate.textContent='Locate Me'; if(gpsDot){ map.removeLayer(gpsDot); gpsDot=null; } if(gpsAccRing){ map.removeLayer(gpsAccRing); gpsAccRing=null; } return; }
      if(!navigator.geolocation){ alert('Geolocation not supported'); return; }
      btnLocate.textContent='Stop Locate';
      gpsWatch = navigator.geolocation.watchPosition(pos=>{
        const { latitude, longitude, accuracy } = pos.coords;
        const ll = [latitude, longitude];
        // dot
        if(!gpsDot){
          gpsDot = L.marker(ll, { interactive:false, zIndexOffset:1000, icon: L.divIcon({ className:'', html:'<div class="gps-dot"></div>' }) }).addTo(map);
        } else { gpsDot.setLatLng(ll); }
        // accuracy ring
        if(!gpsAccRing){ gpsAccRing = L.circle(ll, { radius: Math.min(accuracy||50, 250), color:'#3b82f6', fillColor:'#60a5fa', fillOpacity:0.12, weight:2 }).addTo(map); }
        else { gpsAccRing.setLatLng(ll); gpsAccRing.setRadius(Math.min(accuracy||50, 250)); }
      }, err=>{ alert('Location error: '+err.message); toggleLocate(); }, { enableHighAccuracy:true, maximumAge:3000 });
    }
    btnLocate.onclick = toggleLocate;

    /************************
     * EXPORT / IMPORT / DELETE
     ************************/
    const btnExport = document.getElementById('btnExport');
    const btnImport = document.getElementById('btnImport');
    const btnDelete = document.getElementById('btnDeleteMode');
    const fileInput = document.getElementById('fileImport');
    let deleteMode=false;

    btnExport.onclick = () => {
      const drawings = JSON.parse(localStorage.getItem(STORAGE_DRAW) || '{}');
      const data = { drawings, markers: JSON.parse(localStorage.getItem(STORAGE_MARK) || '[]') };
      const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'buckeyehunterhub-export.json'; a.click(); URL.revokeObjectURL(url);
    };
    btnImport.onclick = () => fileInput.click();
    fileInput.onchange = (ev) => {
      const f = ev.target.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload = () => {
        try{
          const obj = JSON.parse(r.result);
          if(obj.drawings){
            localStorage.setItem(STORAGE_DRAW, JSON.stringify(obj.drawings));
            drawnItems.clearLayers();
            restoreDraw();
          }
          if(obj.markers){ deserializeMarkers(obj.markers); saveMarkers(); }
        } catch{ alert('Invalid JSON/GeoJSON file'); }
        ev.target.value='';
      };
      r.readAsText(f);
    };
    btnDelete.onclick = () => { deleteMode = !deleteMode; btnDelete.textContent = `Delete: ${deleteMode? 'On':'Off'}`; };
    map.on('click', e=>{ if(!deleteMode) return; /* delete by tapping markers only; shapes via draw edit */ });

    /************************
     * OPEN SHEET BUTTONS (stubs kept)
     ************************/
    document.getElementById('menuWaypoints').onclick = ()=> alert('Waypoints manager unchanged here (kept from your current build).');
    document.getElementById('menuTrack').onclick = ()=> alert('Track recorder unchanged here (kept from your current build).');
    document.getElementById('menuRadar').onclick = ()=> alert('Radar controls unchanged here (kept from your current build).');
    document.getElementById('menuWind').onclick = ()=> alert('Wind sheet unchanged here (kept from your current build).');
    document.getElementById('menuMoon').onclick = ()=> alert('Moon phases unchanged here (kept from your current build).');
    document.getElementById('menuScore').onclick = ()=> alert('Hunt Score unchanged here (kept from your current build).');

  </script>
</body>
