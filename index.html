<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1a0f" />
  <title>Buckeye Hunter Hub — Mobile Hunting Map</title>
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Leaflet core -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet.draw -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

  <!-- SunCalc for sun/moon -->

  <style>

</head>
<body>
  <div id="app">
    <div id="map"></div>

    <!-- Top-right logo -->
    <div class="map-logo" aria-label="Buckeye Hunter Hub">
      <img src="Icons/bhh-logo.png" alt="Buckeye Hunter Hub logo"/>
    </div>

    <!-- Field Info panel -->
    <section class="panel" id="infoPanel" style="display:none;">
      <!-- (unchanged content) -->
    </section>

    <!-- Bottom main menu -->
    <nav class="main-menu" id="mainMenu">
      <button id="toggleFieldInfo">Field Info</button>
      <button id="menuMoon">Moon Phases</button>
      <button id="menuScore">Hunt Score</button>
      <button id="menuWind" class="wind-btn"><span class="wind-arrow" id="windArrow"></span><span id="windText">Wind: --</span></button>
      <button id="menuCompass">Compass</button>
      <button id="menuWaypoints">Waypoints</button>
      <button id="menuTrack">Track</button>
      <button id="toggleBasemap">Basemap</button>
      <button id="btnExport">Export</button>
      <button id="btnImport">Import</button>
      <button id="btnDeleteMode">Delete: Off</button>
      <button id="menuLocate">Locate Me</button>
      <input type="file" id="fileImport" accept=".json,.geojson,application/json,application/geo+json" style="display:none" />
    </nav>

    <!-- Sheets -->
    <!-- (all your existing sheets remain unchanged EXCEPT radar sheet is removed) -->
  </div>

  <script>
    /*******************
     * MAP & BASELAYERS *
     *******************/
    const map = L.map('map').setView([40.4173, -82.9071], 7);

    const basic = L.tileLayer('https://api.maptiler.com/maps/basic/{z}/{x}/{y}.png?key=VLOZCnjQYBtgpZ3BXBK3', { attribution: '&copy; MapTiler & OpenStreetMap contributors' });
    const satellite = L.tileLayer('https://api.maptiler.com/tiles/satellite-v2/{z}/{x}/{y}.jpg?key=VLOZCnjQYBtgpZ3BXBK3', { attribution: '&copy; MapTiler' });
    const topo = L.tileLayer('https://api.maptiler.com/maps/topo/{z}/{x}/{y}.png?key=VLOZCnjQYBtgpZ3BXBK3', { attribution: '&copy; MapTiler & OpenStreetMap contributors' });
    const hybrid = L.tileLayer('https://api.maptiler.com/maps/hybrid/{z}/{x}/{y}.jpg?key=VLOZCnjQYBtgpZ3BXBK3', { attribution: '&copy; MapTiler' });

    // Set hybrid as default
    hybrid.addTo(map);

    const baseByKey = { basic, satellite, topo, hybrid };
    const STORAGE_BASE = 'ui_basemap_key';
    function setBasemap(key){ Object.values(baseByKey).forEach(l=> map.removeLayer(l)); baseByKey[key].addTo(map); localStorage.setItem(STORAGE_BASE, key); }
    (function restoreBasemap(){ const k = localStorage.getItem(STORAGE_BASE); if(k && baseByKey[k]) setBasemap(k); })();

    /*******************
     * DRAWING LAYERS  *
     *******************/
    const drawnItems = new L.FeatureGroup().addTo(map);
    // removed drawControl toolbar

    /* (all your existing drawing, markers, waypoints, track, wind, sun/moon, hunt score, compass code stays unchanged) */

    /*******************
     * OHIO PUBLIC HUNTING
     *******************/
    const ohioPublic = L.geoJSON(null, {
      /* (unchanged) */
    });
    async function loadOhioPublic(){ /* (unchanged) */ }
    loadOhioPublic();

    /*******************
     * OHIO COUNTIES + LABELS
     *******************/
    const ohioCounties = L.geoJSON(null, {
      /* (unchanged) */
    });
    const countyLabels = L.layerGroup();
    function labelFontForZoom(z){ /* (unchanged) */ }
    function refreshCountyLabels(){ /* (unchanged) */ }
    function buildCountyLabels(){ /* (unchanged) */ }
    async function loadOhioCounties(){ /* (unchanged) */ }
    loadOhioCounties();

    /*******************
     * WATERFOWL ZONES (ODNR polygons)
     *******************/
    const waterfowlZones = L.geoJSON(null, {
      style: { color:'#22c55e', weight:2, fillOpacity:0.15 },
      onEachFeature: (feat, layer) => {
        const p = feat.properties || {};
        const name = p.Zone_ || p.ZONE_NAME || 'Waterfowl Zone';
        const duck = p.DuckSeason || p.DUCK_SEASON || '';
        const goose = p.GooseSeason || p.GOOSE_SEASON || '';
        const rows = [
          duck ? `<div><span style="color:#a3b7a6">Duck:</span> ${duck}</div>` : '',
          goose ? `<div><span style="color:#a3b7a6">Goose:</span> ${goose}</div>` : ''
        ].join('');
        layer.bindPopup(`<b>${name}</b>${rows ? `<div style="margin-top:6px">${rows}</div>` : ''}`);
        layer.on('mouseover', ()=> layer.setStyle({weight:3}));
        layer.on('mouseout',  ()=> layer.setStyle({weight:2}));
      }
    });

    async function loadWaterfowlZones(){
      try{
        const url = 'https://gis2.ohiodnr.gov/ArcGIS/rest/services/DOW_Services/Hunting_Regulations/MapServer/2/query?where=1%3D1&outFields=*&outSR=4326&f=geojson';
        const r = await fetch(url);
        const j = await r.json();
        waterfowlZones.addData(j);
      }catch(e){
        console.warn('Waterfowl zones load failed', e);
      }
    }
    loadWaterfowlZones();

    /*******************
     * LAYERS CONTROL   *
     *******************/
    const overlaysForControl = { 
      'Ohio Public Hunting': ohioPublic, 
      'Ohio Counties': ohioCounties, 
      'Waterfowl Zones': waterfowlZones,
      'Hunt Markers': markersLayer, 
      'My Drawings': drawnItems, 
      'My Track': trackLayer 
    };
    L.control.layers(
      { 'Basic':basic, 'Satellite':satellite, 'Topographic':topo, 'Hybrid':hybrid }, 
      overlaysForControl, 
      { position:'bottomleft' }
    ).addTo(map);

    /* (rest of your existing scripts: overlays, menu actions, info panel, GPS dot, draggable, service worker, etc. remain unchanged except radar pieces removed) */
  </script>
</body>
</html>
